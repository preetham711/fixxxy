{% extends "layout.html" %}
{% block page_title %}Edit Product{% endblock %}
{% block content %}
<h2 style="margin-bottom: 25px;">Edit Product</h2>
<div class="card" style="max-width: 700px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Product Name *</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Category *</label>
            <select name="category" class="form-control" required>
                {% for cat in categories %}
                <option value="{{ cat }}" {% if cat == product.category %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Price (₹) *</label>
            <input type="number" name="price" step="0.01" min="0" class="form-control" value="{{ product.price }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Stock *</label>
            <input type="number" name="stock" min="0" class="form-control" value="{{ product.stock }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update Product</button>
        <a href="{{ url_for('admin.products') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
